name: Android Flutter CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The repository initially contains Dart sources only. Generate the native
      # Android host project before resolving plugins and building the APK.
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.alalmytmhlat --project-name hisabati .
          # flutter create adds a template test that references the default MyApp class.
          # This project has its own tests and a different root widget.
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hisabati-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
